name: Medtech Venture Scout

on:
  schedule:
    # Every Monday at 07:00 UTC. Adjust the cron expression to change cadence.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the new report + state back

jobs:
  run-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py -v

      - name: Commit and push new report + state
        run: |
          git config user.name "medtech-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ state/
          git diff --cached --quiet && echo "Nothing new to commit" || git commit -m "Automated run: $(date -u +'%Y-%m-%d')"
          git push
